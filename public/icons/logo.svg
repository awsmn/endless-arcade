<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#neonGrad)" stroke-width="8" opacity="0.4" />
  
  <!-- Infinity Game Loop Symbol -->
  <g filter="url(#glow)">
    <!-- Infinity Path -->
    <path d="M170 320 C100 320 80 256 80 256 C80 256 100 192 170 192 C230 192 256 256 256 256 C256 256 282 192 342 192 C412 192 432 256 432 256 C432 256 412 320 342 320 C282 320 256 256 256 256 C256 256 230 320 170 320 Z" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
  
  <!-- Joypad D-Pad Dots inside loops -->
  <!-- Left Loop: D-pad / Cross -->
  <rect x="156" y="226" width="16" height="60" rx="8" fill="#ffffff" />
  <rect x="134" y="248" width="60" height="16" rx="8" fill="#ffffff" />
  
  <!-- Right Loop: Action Buttons (ABXY style) -->
  <circle cx="342" cy="226" r="10" fill="#ec4899" />
  <circle cx="364" cy="248" r="10" fill="#06b6d4" />
  <circle cx="342" cy="270" r="10" fill="#10b981" />
  <circle cx="320" cy="248" r="10" fill="#f59e0b" />
</svg>
